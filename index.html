const cx = (...a) => a.filter(Boolean).join(' ');

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const d = (s) => new Date(s);
const fmtMonth = (s) => MONTHS[d(s).getMonth()];
const fmtDayNum = (s) => d(s).getDate();
const fmtWeekday = (s) => DAYS[d(s).getDay()].slice(0, 3);
const fmtTime = (s) => d(s).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const fmtLong = (s) => `${DAYS[d(s).getDay()]}, ${d(s).getDate()} ${MONTHS[d(s).getMonth()][0]}${MONTHS[d(s).getMonth()].slice(1).toLowerCase()} ${d(s).getFullYear()}`;
const fmtShort = (s) => `${fmtWeekday(s)} ${fmtDayNum(s)} ${MONTHS[d(s).getMonth()][0]}${MONTHS[d(s).getMonth()].slice(1).toLowerCase()}`;
const money = (n) => '€' + n.toFixed(2).replace(/\.00$/, '');

const startOfDay = (x) => { const y = new Date(x); y.setHours(0, 0, 0, 0); return y; };
function daysFromNow(s) {
  return Math.round((startOfDay(d(s)) - startOfDay(new Date())) / 86400000);
}
function relativeLabel(s) {
  const n = daysFromNow(s);
  if (n < 0) return 'Past';
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n < 7) return `In ${n} days`;
  if (n < 14) return 'Next week';
  return null;
}
function isWeekend(s) { const g = d(s).getDay(); return g === 5 || g === 6 || g === 0; }

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem('ticketboss:' + key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('ticketboss:' + key, JSON.stringify(value)); } catch (e) { /* private mode */ }

};

/* ════════════════════════════════════════════════════════════════════════
   2. BRAZE — SDK initialisation and analytics wrapper
   ────────────────────────────────────────────────────────────────────────
   Every call below is wrapped so that a missing or broken SDK can never take
   the UI down with it. Ad blockers routinely block js.appboycdn.com, so
   `brazeReady === false` is a normal state, not an error path.

   Append ?brazeLog=1 to the URL to turn on the SDK's verbose console logging.
   ════════════════════════════════════════════════════════════════════════ */

const BRAZE = {
  apiKey:  '6c30e0b3-6ded-45c8-9a8d-7eadbb065447',  // SDK key — public by design
  baseUrl: 'sdk.fra-02.braze.eu',                   // EU-02 cluster
  version: '6.13'
};

/** Stable pseudonymous id so a returning visitor is the same Braze user. */
function brazeUserId() {
  let id = store.get('userId', null);
  if (!id) {
    id = 'tb-' + Math.random().toString(36).slice(2, 10);
    store.set('userId', id);
  }
  return id;
}

const sdk = window.braze;

const brazeReady = (() => {
  if (!sdk) {
    console.warn('[Ticketboss] Braze SDK did not load — analytics is a no-op. An ad blocker is the usual cause.');
    return false;
  }
  try {
    sdk.initialize(BRAZE.apiKey, {
      baseUrl: BRAZE.baseUrl,
      enableLogging: new URLSearchParams(location.search).has('brazeLog'),
      // Required for HTML in-app messages. It lets JS authored in your Braze
      // dashboard run on the page, so only keep it on if you trust your authors.
      allowUserSuppliedJavascript: true,
      // Relative so it resolves under the /ticketboss/ path on GitHub Pages.
      serviceWorkerLocation: './service-worker.js'
    });
    sdk.automaticallyShowInAppMessages();
    sdk.changeUser(brazeUserId());   // must precede openSession
    sdk.openSession();
    return true;
  } catch (err) {
    console.warn('[Ticketboss] Braze initialize failed:', err);
    return false;
  }
})();

const bz = {
  ready: brazeReady,
  version: BRAZE.version,

  event(name, props) {
    if (!brazeReady) return;
    try { sdk.logCustomEvent(name, props); } catch (e) { /* never break the UI */ }
  },

  purchase(productId, unitPrice, quantity, props) {
    if (!brazeReady) return;
    try { sdk.logPurchase(productId, unitPrice, 'EUR', quantity, props); } catch (e) {}
  },

  attrs(map) {
    if (!brazeReady) return;
    try {
      const u = sdk.getUser();
      Object.keys(map).forEach(k => u.setCustomUserAttribute(k, map[k]));
    } catch (e) {}
  },

  homeCity(city) {
    if (!brazeReady) return;
    try { sdk.getUser().setHomeCity(city); } catch (e) {}
  },

  flush() { if (brazeReady) { try { sdk.requestImmediateDataFlush(); } catch (e) {} } },

  /* ── Content Cards ───────────────────────────────────────────────────── */
  onCards(cb) {
    if (!brazeReady) return () => {};
    try {
      const id = sdk.subscribeToContentCardsUpdates(feed => cb(feed.cards || []));
      const cached = sdk.getCachedContentCards();
      if (cached && cached.cards && cached.cards.length) cb(cached.cards);
      sdk.requestContentCardsRefresh();
      return () => { try { sdk.removeSubscription(id); } catch (e) {} };
    } catch (e) { return () => {}; }
  },
  cardsSeen(cards) { if (brazeReady && cards.length) { try { sdk.logContentCardImpressions(cards); } catch (e) {} } },
  cardClick(card)  { if (brazeReady) { try { sdk.logContentCardClick(card); } catch (e) {} } },
  cardDismiss(card){ if (brazeReady) { try { sdk.logCardDismissal(card); } catch (e) {} } },

  /* ── Web push ────────────────────────────────────────────────────────── */
  pushSupported() { try { return brazeReady && sdk.isPushSupported(); } catch (e) { return false; } },
  pushGranted()   { try { return brazeReady && sdk.isPushPermissionGranted(); } catch (e) { return false; } },
  pushBlocked()   { try { return brazeReady && sdk.isPushBlocked(); } catch (e) { return false; } },
  requestPush(onOk, onNo) {
    if (!brazeReady) { onNo && onNo(); return; }
    try { sdk.requestPushPermission(onOk, onNo); } catch (e) { onNo && onNo(); }
  }
};

const SECTIONS = ['A','B','C','D','E','LOWER 112','UPPER 305','STALLS','PIT'];

function makeOrderId(seed) {
  const r = rng(hash(seed));
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let s = 'TB-';
  for (let i = 0; i < 3; i++) s += letters[Math.floor(r() * letters.length)];
  s += '-';
  for (let i = 0; i < 5; i++) s += Math.floor(r() * 10);
  return s;
}

function buildTicket(eventId, tierId, qty, stamp) {
  const seed = eventId + tierId + qty + stamp;
  const r = rng(hash(seed));
  const ev = EVENT_BY_ID[eventId];
  const tier = TIERS.find(t => t.id === tierId) || TIERS[0];
  const section = SECTIONS[Math.floor(r() * SECTIONS.length)];
  const row = String.fromCharCode(65 + Math.floor(r() * 12));
  const first = 1 + Math.floor(r() * 24);
  return {
    id: 'tk-' + hash(seed).toString(36),
    eventId, tierId, qty,
    tierName: tier.name,
    section, row,
    seats: Array.from({ length: qty }, (_, i) => `${first + i}`),
    orderId: makeOrderId(seed),
    total: +(ev.price * tier.mult * qty + FEE * qty).toFixed(2),
    purchasedAt: stamp
  };
}

/* ── QR + barcode mockups ────────────────────────────────────────────── */

function QRCode({ value, className = 'h-32 w-32' }) {
  const N = 25;
  const matrix = useMemo(() => {
    const r = rng(hash(value));
    const m = Array.from({ length: N }, () => Array(N).fill(0));
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) m[y][x] = r() > 0.52 ? 1 : 0;
    const clear = (ox, oy) => {
      for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
        const yy = oy + y, xx = ox + x;
        if (yy >= 0 && yy < N && xx >= 0 && xx < N) m[yy][xx] = 0;
      }
    };
    const finder = (ox, oy) => {
      for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
        const edge = x === 0 || x === 6 || y === 0 || y === 6;
        const core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
        m[oy + y][ox + x] = edge || core ? 1 : 0;
      }
    };
    clear(0, 0); clear(N - 7, 0); clear(0, N - 7);
    finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
    for (let i = 8; i < N - 8; i++) { m[6][i] = i % 2 === 0 ? 1 : 0; m[i][6] = i % 2 === 0 ? 1 : 0; }
    const ax = N - 9, ay = N - 9;
    for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
      const edge = x === 0 || x === 4 || y === 0 || y === 4;
      m[ay + y][ax + x] = edge || (x === 2 && y === 2) ? 1 : 0;
    }
    return m;
  }, [value]);

  return (
    <svg viewBox={`0 0 ${N} ${N}`} className={className} role="img" aria-label={`QR code for ${value}`} shapeRendering="crispEdges">
      <rect width={N} height={N} fill="#fff" />
      {matrix.map((row, y) => row.map((v, x) => v ? <rect key={x + '-' + y} x={x} y={y} width="1" height="1" fill="#1A1A24" /> : null))}
    </svg>
  );
}

function Barcode({ value, className = 'h-10 w-full' }) {
  const bars = useMemo(() => {
    const r = rng(hash(value + 'bar'));
    const out = []; let x = 0;
    while (x < 300) { const w = 1 + Math.floor(r() * 4); out.push({ x, w }); x += w + 1 + Math.floor(r() * 3); }
    return out;
  }, [value]);
  return (
    <svg viewBox="0 0 300 40" preserveAspectRatio="none" className={className} aria-hidden="true">
      {bars.map((b, i) => <rect key={i} x={b.x} y="0" width={b.w} height="40" fill="#1A1A24" />)}
    </svg>
  );
}

/* ── Modal + toast ───────────────────────────────────────────────────── */

function Modal({ open, onClose, children, size = 'md' }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [open, onClose]);

  if (!open) return null;
  const widths = { sm: 'max-w-md', md: 'max-w-xl', lg: 'max-w-3xl' };
  return (
    <div className="fixed inset-0 z-[90] flex items-end justify-center overflow-y-auto bg-ink/45 p-0 backdrop-blur-sm sm:items-center sm:p-6"
         onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className={cx('pop-in relative my-0 w-full rounded-t-4xl bg-white shadow-lift sm:my-8 sm:rounded-3xl', widths[size])}>
        <button onClick={onClose} aria-label="Close"
          className="absolute right-4 top-4 z-10 rounded-full bg-white/90 p-2 text-ink-500 ring-1 ring-fog-200 transition hover:text-ink hover:ring-ink-200">
          <Icon name="x" className="h-4 w-4" strokeWidth={2} />
        </button>
        {children}
      </div>
    </div>
  );
}

function Toast({ toast }) {
  if (!toast) return null;
  return (
    <div className="pointer-events-none fixed inset-x-0 bottom-24 z-[100] flex justify-center px-4 sm:bottom-8">
      <div className="toast-in flex items-center gap-3 rounded-2xl bg-ink px-4 py-3 text-white shadow-lift">
        <span className="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-coral-500">
          <Icon name={toast.icon || 'check'} className="h-4 w-4" strokeWidth={2.4} />
        </span>
        <span className="text-sm font-medium">{toast.message}</span>
      </div>
    </div>
  );
}

function EventDetail({ event, saved, onToggleSave, onClose, onBuy, notify }) {

  useEffect(() => { setTierId('ga'); setQty(2); }, [event && event.id]);

  if (!event) return null;
  const tier = TIERS.find(t => t.id === tierId);
  const unit = event.price * tier.mult;
  const total = unit * qty + FEE * qty;

  return (
    <Modal open={!!event} onClose={onClose} size="lg">
      <div className="overflow-hidden rounded-t-4xl sm:rounded-t-3xl">
        <Cover event={event} className="h-44 w-full sm:h-56" rounded="rounded-none" />
      </div>

      <div className="p-5 sm:p-7">
        <div className="flex flex-wrap items-center gap-2">
          <Tag tone="brand">{CAT[event.category].name}</Tag>
          {event.tags.map(t => <Tag key={t} tone="grey">{t}</Tag>)}
          <span className="ml-auto inline-flex items-center gap-1 text-[13px] font-semibold text-ink">
            <Icon name="star" className="h-4 w-4 text-coral-500" fill="currentColor" strokeWidth={0} />
            {event.rating.toFixed(1)}

        <h2 className="mt-3 font-display text-[26px] font-bold leading-tight tracking-tight text-ink sm:text-[32px]">{event.title}</h2>
        <p className="mt-1 text-[15px] text-ink-500">{event.sub}</p>

          <InfoTile icon="calendar" label="Date"  value={fmtShort(event.date)} sub={fmtTime(event.date)} />
          <InfoTile icon="mapPin"   label="Venue" value={event.venue} sub={event.city} />
          <InfoTile icon="eye"      label="Demand" value={`${Math.round(event.sold * 100)}% sold`} sub={event.sold > 0.8 ? 'Selling fast' : 'Good availability'} />
        </div>

        <div className="mt-7">
          <h3 className="mb-3 font-display text-[16px] font-bold text-ink">Choose your tickets</h3>
          <div className="space-y-2.5">
            {TIERS.map(t => {
              const active = t.id === tierId;
              return (
                <button key={t.id} onClick={() => setTierId(t.id)}
                  className={cx(
                    'flex w-full items-center gap-4 rounded-2xl p-4 text-left transition-all duration-200',
                    active ? 'bg-brand-50 ring-2 ring-brand-500' : 'bg-white ring-1 ring-fog-200 hover:ring-ink-200'

                  )}>
                    {active && <Icon name="check" className="h-3 w-3" strokeWidth={3} />}
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-[14px] font-semibold text-ink">{t.name}</span>
                    <span className="block truncate text-[12.5px] text-ink-500">{t.desc} · {t.perk}</span>
                  </span>
                  <span className="shrink-0 font-display text-[16px] font-bold text-ink">{money(event.price * t.mult)}</span>
                </button>
              );
            })}
          </div>
        </div>

        <div className="mt-6 flex flex-wrap items-center justify-between gap-4 rounded-2xl bg-fog-100 p-4">
          <div className="flex items-center gap-3">
            <span className="text-[13px] font-semibold text-ink-500">Quantity</span>
            <div className="flex items-center gap-1 rounded-xl bg-white p-1 ring-1 ring-fog-200">

                className="grid h-8 w-8 place-items-center rounded-lg text-ink-500 transition hover:bg-fog-100 hover:text-ink active:scale-90">
                <Icon name="minus" className="h-4 w-4" strokeWidth={2.2} />
              </button>

                <Icon name="plus" className="h-4 w-4" strokeWidth={2.2} />

            </div>
          </div>
          <div className="text-right">
            <p className="text-[12px] text-ink-300">{qty} × {money(unit)} + {money(FEE)} fees</p>

/** Braze Content Cards rendered as a notification inbox. */
function CardsPanel({ cards, onCardClick, onCardDismiss, onClose, notify }) {
  const [pushState, setPushState] = useState(() =>
    bz.pushGranted() ? 'granted' : bz.pushBlocked() ? 'blocked' : 'ask');

  // Impressions count once, when the panel is actually opened.
  useEffect(() => { bz.cardsSeen(cards); }, []);

  const askPush = () => {
    bz.requestPush(
      () => { setPushState('granted'); notify('Push notifications enabled', 'bell'); },
      () => { setPushState('blocked'); notify('Notifications were declined', 'x'); }
    );
  };

  return (
    <div className="pop-in absolute right-0 mt-2 max-h-[70vh] w-[min(360px,calc(100vw-2rem))] overflow-y-auto rounded-2xl bg-white p-2 shadow-lift ring-1 ring-fog-200"
         onClick={(e) => e.stopPropagation()}>
      <div className="flex items-center justify-between px-2 py-2">
        <h3 className="font-display text-[15px] font-bold text-ink">Notifications</h3>
        <button onClick={onClose} aria-label="Close" className="rounded-lg p-1 text-ink-300 transition hover:bg-fog-100 hover:text-ink">
          <Icon name="x" className="h-4 w-4" strokeWidth={2.2} />
        </button>
      </div>

      {bz.pushSupported() && pushState === 'ask' && (
        <div className="mb-2 rounded-xl bg-brand-50 p-3 ring-1 ring-brand-100">
          <p className="text-[13px] font-semibold text-ink">Never miss an on-sale</p>
          <p className="mt-0.5 text-[12.5px] leading-relaxed text-ink-500">
            Get a push the moment tickets drop for artists you follow.
          </p>
          <Button variant="brand" size="sm" className="mt-2.5 w-full" onClick={askPush}>
            <Icon name="bell" className="h-3.5 w-3.5" />Enable notifications
          </Button>
        </div>
      )}
      {pushState === 'granted' && (
        <div className="mb-2 flex items-center gap-2 rounded-xl bg-fog-100 px-3 py-2 text-[12.5px] font-medium text-ink-500">
          <Icon name="check" className="h-4 w-4 text-brand-600" strokeWidth={2.4} />Push notifications are on
        </div>
      )}

      {cards.length === 0 ? (
        <div className="px-3 py-8 text-center">
          <span className="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-fog-100 text-ink-300">
            <Icon name="bell" className="h-5 w-5" />
          </span>
          <p className="mt-3 text-[13.5px] font-semibold text-ink">Nothing new right now</p>
          <p className="mx-auto mt-1 max-w-[240px] text-[12.5px] leading-relaxed text-ink-300">
            {bz.ready
              ? 'Content Cards from your Braze campaigns will land here.'
              : 'The Braze SDK did not load, so Content Cards are unavailable.'}
          </p>
        </div>
      ) : (
        <ul className="space-y-1.5">
          {cards.map(card => (
            <li key={card.id}
                className="group relative cursor-pointer rounded-xl p-2.5 transition hover:bg-fog-100"
                onClick={() => onCardClick(card)}>
              <div className="flex gap-3">
                {card.imageUrl && (
                  <img src={card.imageUrl} alt="" className="h-12 w-12 shrink-0 rounded-lg object-cover ring-1 ring-fog-200" />
                )}
                <div className="min-w-0 flex-1">
                  <div className="flex items-start gap-2">
                    {!card.viewed && <span className="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-coral-500" />}
                    <p className="flex-1 text-[13.5px] font-semibold leading-snug text-ink">{card.title || 'Update'}</p>
                  </div>
                  {card.description && (
                    <p className="mt-0.5 text-[12.5px] leading-relaxed text-ink-500">{card.description}</p>
                  )}
                  {card.linkText && (
                    <span className="mt-1.5 inline-flex items-center gap-1 text-[12.5px] font-semibold text-brand-600">
                      {card.linkText}<Icon name="arrowR" className="h-3.5 w-3.5" strokeWidth={2.1} />
                    </span>
                  )}
                </div>
                <button
                  onClick={(e) => { e.stopPropagation(); onCardDismiss(card); }}
                  aria-label="Dismiss"
                  className="h-6 w-6 shrink-0 rounded-lg text-ink-200 opacity-0 transition hover:bg-white hover:text-ink group-hover:opacity-100">
                  <Icon name="x" className="mx-auto h-3.5 w-3.5" strokeWidth={2.2} />
                </button>
              </div>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

const NAV = [
  { id: 'home',    label: 'Discover',   short: 'Discover', icon: 'home' },
  { id: 'search',  label: 'Search',     short: 'Search',   icon: 'search' },
  { id: 'events',  label: 'My events',  short: 'Saved',    icon: 'heart' },
  { id: 'tickets', label: 'My tickets', short: 'Tickets',  icon: 'ticket' }
];

function Navbar({ view, setView, city, setCity, savedCount, ticketCount, cards, onCardClick, onCardDismiss, notify }) {
  const [scrolled, setScrolled] = useState(false);
  const [cityOpen, setCityOpen] = useState(false);
  const [cardsOpen, setCardsOpen] = useState(false);
  const unread = cards.filter(c => !c.viewed).length;

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  useEffect(() => {
    const close = () => setCityOpen(false);
    if (cityOpen) { document.addEventListener('click', close); return () => document.removeEventListener('click', close); }
  }, [cityOpen]);
  useEffect(() => {
    const close = () => setCardsOpen(false);
    if (cardsOpen) { document.addEventListener('click', close); return () => document.removeEventListener('click', close); }
  }, [cardsOpen]);

  return (
    <header className={cx(
      'sticky top-0 z-50 w-full transition-all duration-300',
      scrolled ? 'border-b border-fog-200 bg-white/85 backdrop-blur-xl' : 'bg-transparent'
    )}>
      <div className="mx-auto flex h-16 max-w-8xl items-center gap-4 px-4 sm:h-[72px] sm:px-6 lg:px-10">
        <Logo onClick={() => setView('home')} />

        {/* Desktop nav */}
        <nav className="ml-6 hidden items-center gap-1 lg:flex">
          {NAV.map(n => {
            const active = view === n.id;
            const badge = n.id === 'events' ? savedCount : n.id === 'tickets' ? ticketCount : 0;
            return (
              <button key={n.id} onClick={() => setView(n.id)}
                className={cx(
                  'relative flex items-center gap-2 rounded-xl px-3.5 py-2 text-[14px] font-semibold transition-all duration-200',
                  active ? 'bg-ink text-white shadow-soft' : 'text-ink-500 hover:bg-fog-100 hover:text-ink'
                )}>
                <Icon name={n.icon} className="h-[17px] w-[17px]" />
                {n.label}
                {badge > 0 && (
                  <span className={cx(
                    'ml-0.5 rounded-full px-1.5 py-0.5 text-[10px] font-bold leading-none',

function Radio({ checked, onChange, label }) {

function FilterPanel({ filters, setFilters, counts, onReset }) {
  const toggleCat = (id) => setFilters(f => ({
    ...f, categories: f.categories.includes(id) ? f.categories.filter(x => x !== id) : [...f.categories, id]
  }));
  return (
    <div>
      <div className="flex items-center justify-between pb-2">
        <h3 className="font-display text-[17px] font-bold text-ink">Filters</h3>
        <button onClick={onReset} className="text-[13px] font-semibold text-brand-600 transition hover:text-brand-700">
          Reset
        </button>
      </div>

      <FilterGroup title="Category">
        {CATEGORIES.map(c => (
          <Check key={c.id} checked={filters.categories.includes(c.id)} onChange={() => toggleCat(c.id)}
                 label={c.name} count={counts[c.id] || 0} />
        ))}
      </FilterGroup>

      <FilterGroup title="Date">
        {DATE_FILTERS.map(f => (
          <Radio key={f.id} checked={filters.date === f.id} onChange={() => setFilters(s => ({ ...s, date: f.id }))} label={f.label} />
        ))}
      </FilterGroup>

      <FilterGroup title="Max price">
        <div className="px-1">
          <div className="mb-3 flex items-baseline justify-between">
            <span className="text-[13px] text-ink-500">Up to</span>
            <span className="font-display text-[19px] font-bold text-ink">
              {filters.maxPrice >= 250 ? 'Any' : money(filters.maxPrice)}
            </span>
          </div>
          <input type="range" min="10" max="250" step="5" value={filters.maxPrice}
                 onChange={(e) => setFilters(s => ({ ...s, maxPrice: +e.target.value }))}
                 className="w-full" aria-label="Maximum price" />
          <div className="mt-2 flex justify-between text-[11px] text-ink-300"><span>€10</span><span>€250+</span></div>
        </div>
      </FilterGroup>

      <FilterGroup title="City" defaultOpen={false}>
        <Radio checked={filters.city === 'all'} onChange={() => setFilters(s => ({ ...s, city: 'all' }))} label="Anywhere" />
        {CITIES.map(c => (
          <Radio key={c} checked={filters.city === c} onChange={() => setFilters(s => ({ ...s, city: c }))} label={c} />
        ))}
      </FilterGroup>
    </div>
  );
}

function applyFilters(events, { query, categories, date, maxPrice, city }, sort) {
  const q = query.trim().toLowerCase();
  let out = events.filter(e => {
    if (q) {
      const hay = [e.title, e.sub, e.venue, e.city, CAT[e.category].name, ...e.tags].join(' ').toLowerCase();
      const priceHit = /under\s*€?\s*(\d+)/.exec(q);
      if (priceHit) { if (e.price > +priceHit[1]) return false; }
      else if (!hay.includes(q)) {
        if (!(q.includes('weekend') && isWeekend(e.date))) return false;
      }
    }
    if (categories.length && !categories.includes(e.category)) return false;
    if (city !== 'all' && e.city !== city) return false;
    if (e.price > maxPrice && maxPrice < 250) return false;
    const n = daysFromNow(e.date);
    if (date === 'today' && n !== 0) return false;
    if (date === 'weekend' && !(n >= 0 && n <= 7 && isWeekend(e.date))) return false;
    if (date === 'month' && !(n >= 0 && n <= 30)) return false;
    if (date === 'later' && n <= 30) return false;
    return true;
  });

  const by = {
    relevance: (a, b) => b.sold * b.rating - a.sold * a.rating,
    date:      (a, b) => d(a.date) - d(b.date),
    priceAsc:  (a, b) => a.price - b.price,
    priceDesc: (a, b) => b.price - a.price,
    rating:    (a, b) => b.rating - a.rating
  };
  return out.sort(by[sort] || by.relevance);
}

function SearchView({ query, setQuery, filters, setFilters, sort, setSort, saved, toggleSave, openEvent, resetFilters }) {
  const [sheetOpen, setSheetOpen] = useState(false);
  const results = useMemo(() => applyFilters(EVENTS, { ...filters, query }, sort), [filters, query, sort]);
  const counts = useMemo(() => Object.fromEntries(CATEGORIES.map(c => [c.id, EVENTS.filter(e => e.category === c.id).length])), []);

  // Braze: one search_performed per settled query/filter combination, not per
  // keystroke. Skips the bare default state so landing on the tab isn't a search.
  useEffect(() => {
    const touched = query.trim() || filters.categories.length || filters.date !== 'any'
                 || filters.maxPrice < 250 || filters.city !== 'all';
    if (!touched) return;
    const t = setTimeout(() => {
      bz.event('search_performed', {
        query: query.trim(),
        results_count: results.length,
        categories: filters.categories.map(c => CAT[c].name).join(', '),
        date_filter: filters.date,
        max_price: filters.maxPrice,
        city: filters.city,
        sort_by: sort,
        zero_results: results.length === 0
      });
    }, 900);
    return () => clearTimeout(t);
  }, [query, filters, sort, results.length]);

  const activeChips = [
    ...filters.categories.map(c => ({ key: 'cat:' + c, label: CAT[c].name, clear: () => setFilters(f => ({ ...f, categories: f.categories.filter(x => x !== c) })) })),
    filters.date !== 'any' && { key: 'date', label: DATE_FILTERS.find(f => f.id === filters.date).label, clear: () => setFilters(f => ({ ...f, date: 'any' })) },
    filters.maxPrice < 250 && { key: 'price', label: `Under ${money(filters.maxPrice)}`, clear: () => setFilters(f => ({ ...f, maxPrice: 250 })) },
    filters.city !== 'all' && { key: 'city', label: filters.city, clear: () => setFilters(f => ({ ...f, city: 'all' })) }
  ].filter(Boolean);

  return (
    <div className="mx-auto max-w-8xl px-4 py-8 sm:px-6 sm:py-10 lg:px-10">
      <div className="mb-7 max-w-3xl">
        <h1 className="font-display text-[30px] font-bold tracking-tight text-ink sm:text-[38px]">Search events</h1>
        <p className="mt-2 text-[15px] text-ink-500">Filter 2,480 listings by category, date and budget.</p>
      </div>

      <div className="sticky top-16 z-30 -mx-4 mb-6 bg-fog/85 px-4 py-3 backdrop-blur-xl sm:top-[72px] sm:-mx-6 sm:px-6 lg:-mx-10 lg:px-10">
        <div className="flex gap-2.5">
          <div className="min-w-0 flex-1">
            <SearchBar value={query} onChange={setQuery} onSubmit={() => {}} />
          </div>
          <button onClick={() => setSheetOpen(true)}
            className="flex shrink-0 items-center gap-2 rounded-2xl bg-white px-4 text-[14px] font-semibold text-ink shadow-soft ring-1 ring-fog-200 transition hover:ring-ink-200 lg:hidden">
            <Icon name="filter" className="h-4 w-4" />
            Filters
            {activeChips.length > 0 && (
              <span className="rounded-full bg-brand-500 px-1.5 py-0.5 text-[10px] font-bold leading-none text-white">{activeChips.length}</span>
            )}
          </button>
        </div>
      </div>

      <div className="flex gap-8">
        {/* Sidebar */}
        <aside className="hidden w-[270px] shrink-0 lg:block">
          <div className="sticky top-[104px] rounded-3xl bg-white p-5 shadow-soft ring-1 ring-fog-200">
            <FilterPanel filters={filters} setFilters={setFilters} counts={counts} onReset={resetFilters} />
          </div>
        </aside>

        {/* Results */}
        <div className="min-w-0 flex-1">
          <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
            <p className="text-[14px] text-ink-500">

              {results.length === 1 ? 'event' : 'events'} found
              {query && <> for “<span className="font-semibold text-ink">{query}</span>”</>}
            </p>
            <label className="flex items-center gap-2 text-[13px] text-ink-500">
              Sort by
              <select value={sort} onChange={(e) => setSort(e.target.value)}
                className="cursor-pointer rounded-xl bg-white px-3 py-2 text-[13.5px] font-semibold text-ink shadow-soft ring-1 ring-fog-200 outline-none transition hover:ring-ink-200">
                {SORTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </label>
          </div>

          {activeChips.length > 0 && (
            <div className="mb-5 flex flex-wrap items-center gap-2">
              {activeChips.map(c => (
                <button key={c.key} onClick={c.clear}
                  className="inline-flex items-center gap-1.5 rounded-full bg-brand-50 py-1.5 pl-3 pr-2 text-[12.5px] font-semibold text-brand-700 ring-1 ring-brand-100 transition hover:bg-brand-100">

    </div>
  );
}

          <div className="flex flex-wrap gap-5 text-[13px] text-ink-300">
            {['Privacy', 'Terms', 'Cookies', 'Sitemap'].map(l => (
              <a key={l} href="#" onClick={(e) => e.preventDefault()} className="transition hover:text-ink">{l}</a>
            ))}
          </div>
        </div>
      </div>
    </footer>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   15. APP
   ════════════════════════════════════════════════════════════════════════ */

const DEFAULT_FILTERS = { categories: [], date: 'any', maxPrice: 250, city: 'all' };

function App() {
  const [view, setViewRaw] = useState('home');
  const [city, setCity] = useState(() => store.get('city', 'Madrid'));
  const [query, setQuery] = useState('');
  const [sort, setSort] = useState('relevance');
  const [filters, setFilters] = useState(DEFAULT_FILTERS);

  const [saved, setSaved]   = useState(() => store.get('saved', SEED_SAVED));
  const [going, setGoing]   = useState(() => store.get('going', SEED_GOING));
  const [tickets, setTickets] = useState(() => store.get('tickets', SEED_TICKETS));

  const [activeEvent, setActiveEvent] = useState(null);
  const [activeTicket, setActiveTicket] = useState(null);
  const [toast, setToast] = useState(null);
  const [cards, setCards] = useState([]);
  const toastTimer = useRef(null);

  useEffect(() => store.set('saved', saved), [saved]);
  useEffect(() => store.set('going', going), [going]);
  useEffect(() => store.set('tickets', tickets), [tickets]);
  useEffect(() => store.set('city', city), [city]);

  /* ── Braze: Content Cards subscription ─────────────────────────────── */
  useEffect(() => bz.onCards(setCards), []);

  /* ── Braze: keep the user profile in sync with app state ───────────── */
  useEffect(() => {
    const spend = tickets.reduce((s, t) => s + t.total, 0);
    const counts = {};
    saved.forEach(id => {
      const e = EVENT_BY_ID[id];
      if (e) counts[e.category] = (counts[e.category] || 0) + 1;
    });
    const favourite = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    bz.attrs({
      saved_events:    saved.length,
      going_events:    going.length,
      tickets_owned:   tickets.reduce((s, t) => s + t.qty, 0),
      lifetime_spend:  +spend.toFixed(2),
      favourite_category: favourite ? CAT[favourite].name : null,
      home_city:       city
    });
  }, [saved, going, tickets, city]);

  const notify = useCallback((message, icon = 'check') => {
    setToast({ message, icon, id: Date.now() });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }, []);

  const setView = useCallback((v) => {
    setViewRaw(prev => {
      if (prev !== v) bz.event('screen_viewed', { screen: v, from: prev });
      return v;
    });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  const changeCity = useCallback((c) => {
    setCity(c);
    bz.homeCity(c);
    bz.event('city_changed', { city: c });
  }, []);

  const openEvent = useCallback((e) => {
    setActiveEvent(e);
    if (e) bz.event('event_viewed', eventProps(e, { percent_sold: Math.round(e.sold * 100) }));
  }, []);

  const openTicket = useCallback((t) => {
    setActiveTicket(t);
    if (t) {
      const ev = EVENT_BY_ID[t.eventId];
      bz.event('ticket_pass_opened', eventProps(ev, {
        order_id: t.orderId, tier: t.tierName, quantity: t.qty
      }));
    }
  }, []);

  const toggleSave = useCallback((id) => {
    setSaved(s => {
      const has = s.includes(id);
      notify(has ? 'Removed from saved events' : 'Saved to My events', has ? 'trash' : 'heart');
      const ev = EVENT_BY_ID[id];
      if (ev) bz.event(has ? 'event_unsaved' : 'event_saved', eventProps(ev));
      return has ? s.filter(x => x !== id) : [...s, id];
    });
  }, [notify]);

  const toggleGoing = useCallback((id) => {
    setGoing(g => {
      const has = g.includes(id);
      notify(has ? 'No longer marked as going' : "Marked as going — we'll remind you", 'check');
      const ev = EVENT_BY_ID[id];
      if (ev) bz.event(has ? 'unmarked_going' : 'marked_going', eventProps(ev));
      return has ? g.filter(x => x !== id) : [...g, id];
    });
  }, [notify]);

  const buy = useCallback((eventId, tierId, qty) => {
    const t = buildTicket(eventId, tierId, qty, new Date().toISOString());
    const ev = EVENT_BY_ID[eventId];
    const tier = TIERS.find(x => x.id === tierId) || TIERS[0];
    // Braze revenue = unitPrice × quantity, so send the all-in per-ticket price.
    const unitAllIn = +(ev.price * tier.mult + FEE).toFixed(2);

    setTickets(list => [t, ...list.filter(x => x.id !== t.id)]);
    setActiveEvent(null);
    setView('tickets');
    notify(`${qty} ${qty > 1 ? 'tickets' : 'ticket'} added to your wallet`, 'ticket');

    bz.purchase(eventId, unitAllIn, qty, eventProps(ev, {
      tier: tier.name, order_id: t.orderId, section: t.section, row: t.row
    }));
    bz.event('ticket_purchased', eventProps(ev, {
      tier: tier.name, quantity: qty, order_total: t.total, order_id: t.orderId
    }));
    bz.flush();   // demo: surface the purchase in Braze immediately
  }, [notify, setView]);

  const goSearch = useCallback(() => setView('search'), [setView]);

  const pickCategory = useCallback((catId) => {
    setFilters({ ...DEFAULT_FILTERS, categories: [catId], city });
    setQuery('');
    setView('search');
    bz.event('category_browsed', { category: CAT[catId].name, city });
  }, [city, setView]);

  const resetFilters = useCallback(() => { setFilters(DEFAULT_FILTERS); setQuery(''); }, []);

  const onCardClick = useCallback((card) => {
    bz.cardClick(card);
    bz.event('content_card_clicked', { card_id: card.id, title: card.title || '' });
    if (card.url) window.open(card.url, '_blank', 'noopener');
  }, []);

  const onCardDismiss = useCallback((card) => {
    bz.cardDismiss(card);
    setCards(cs => cs.filter(c => c.id !== card.id));
  }, []);

  return (
    <div className="min-h-screen bg-fog pb-20 lg:pb-0">
      <Navbar view={view} setView={setView} city={city} setCity={changeCity}
              savedCount={saved.length} ticketCount={tickets.length}
              cards={cards} onCardClick={onCardClick} onCardDismiss={onCardDismiss} notify={notify} />

      <main key={view} className="fade-up">
        {view === 'home' && (
          <HomeView city={city} query={query} setQuery={setQuery} goSearch={goSearch} events={EVENTS}
                    saved={saved} toggleSave={toggleSave} openEvent={openEvent} onPickCategory={pickCategory}
                    cards={cards} onCardClick={onCardClick} onCardDismiss={onCardDismiss} />
        )}
        {view === 'search' && (
          <SearchView query={query} setQuery={setQuery} filters={filters} setFilters={setFilters}
                      sort={sort} setSort={setSort} saved={saved} toggleSave={toggleSave}
                      openEvent={openEvent} resetFilters={resetFilters} />
        )}
        {view === 'events' && (
          <MyEventsView saved={saved} going={going} toggleSave={toggleSave} toggleGoing={toggleGoing}
                        openEvent={openEvent} goSearch={goSearch} />
        )}
        {view === 'tickets' && (
          <MyTicketsView tickets={tickets} openTicket={openTicket} goSearch={goSearch} notify={notify} />
        )}
      </main>

      <Footer setView={setView} />
      <MobileTabBar view={view} setView={setView} savedCount={saved.length} ticketCount={tickets.length} />

      <EventDetail event={activeEvent} saved={activeEvent ? saved.includes(activeEvent.id) : false}
                   onToggleSave={toggleSave} onClose={() => setActiveEvent(null)} onBuy={buy} notify={notify} />
      <TicketDetail ticket={activeTicket} onClose={() => setActiveTicket(null)} notify={notify} />
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
